name: Derleme

# Her push ve PR'da testler + derleme. İmza anahtarı ve hiçbir gizli değer kullanılmaz,
# bu yüzden dışarıdan gelen PR'lar da güvenle çalışır.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test ve derleme
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
