name: Sürüm yayınla

# Yalnızca depo sahibinin gönderdiği "v*" etiketiyle çalışır (ör. v0.8.0).
# APK, GitHub'ın gizli kasasındaki anahtarla imzalanır ve Releases'e konur.
# Kokpit ünitede releases/latest/download/version.json adresini kontrol eder.
# Aynı sürüme telefon uygulaması Kokpit Kumanda da (aynı anahtarla imzalı) eklenir;
# version.json yalnızca ünitedeki Kokpit'i anlatır.
on:
  push:
    tags: ["v*"]
  # Elle: Actions → "Sürüm yayınla" → Run workflow. Etiket versionName'den (vX.Y.Z) oluşturulur.
  workflow_dispatch:
    inputs:
      notes:
        description: "Sürüm notları"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Anahtar ve sürüm kontrolü
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.KOKPIT_KEYSTORE_B64 != '' && secrets.KOKPIT_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::İmza anahtarı yok. Önce 'İmza anahtarı oluştur' iş akışını çalıştırın."
            exit 1
          fi
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if gh release view "v$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v$NAME zaten yayınlanmış. Önce versionCode/versionName'i artırın."
              exit 1
            fi
          elif [ "v$NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Etiket ($GITHUB_REF_NAME) ile versionName (v$NAME) aynı değil."
            exit 1
          fi

      - name: Test ve imzalı derleme
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          KOKPIT_KEYSTORE_B64: ${{ secrets.KOKPIT_KEYSTORE_B64 }}
          KOKPIT_KEYSTORE_PASSWORD: ${{ secrets.KOKPIT_KEYSTORE_PASSWORD }}
          KOKPIT_KEY_ALIAS: kokpit
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :kumanda:testDebugUnitTest :kumanda:assembleRelease

      - name: version.json ve yayın
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          TAG_NAME="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK="kokpit-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # İmzanın gerçekten kasadaki anahtar olduğunu doğrula (debug anahtarı değil).
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then echo "::error::Debug anahtarıyla imzalanmış"; exit 1; fi
          KNAME=$(grep -oP 'versionName = "\K[^"]+' kumanda/build.gradle.kts)
          KAPK="kokpit-kumanda-$KNAME.apk"
          cp kumanda/build/outputs/apk/release/kumanda-release.apk "$KAPK"
          "$APKSIGNER" verify --print-certs "$KAPK" | tee kumanda-signer.txt
          if grep -q "CN=Android Debug" kumanda-signer.txt; then echo "::error::Kumanda debug anahtarıyla imzalanmış"; exit 1; fi
          # İki uygulama aynı anahtarla imzalanmış olmalı.
          if [ "$(grep 'SHA-256' signer.txt)" != "$(grep 'SHA-256' kumanda-signer.txt)" ]; then echo "::error::Kumanda farklı anahtarla imzalanmış"; exit 1; fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$APK"
          python3 - "$CODE" "$NAME" "$URL" "$SHA" "$SIZE" <<'PY'
          import json, os, sys, subprocess
          code, name, url, sha, size = sys.argv[1:]
          notes = os.environ.get("INPUT_NOTES", "").strip() or subprocess.run(["git", "tag", "-l", "--format=%(contents)", f"v{name}"], capture_output=True, text=True).stdout.strip()
          json.dump({"versionCode": int(code), "versionName": name, "apk": url, "sha256": sha, "sizeBytes": int(size), "notes": notes},
                    open("version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          NOTES=$(python3 -c "import json;print(json.load(open('version.json'))['notes'] or 'Kokpit $NAME')")
          # Elle çalıştırmada etiket burada, bu commit üzerinde oluşturulur.
          gh release create "$TAG_NAME" "$APK" "$KAPK" version.json --title "Kokpit $NAME" --notes "$NOTES" --target "$GITHUB_SHA"
